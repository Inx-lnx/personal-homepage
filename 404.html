<!DOCTYPE html>
<!--
  GitHub Pages 404 页：仓库根目录的 404.html 会自动接管所有不存在的路径。
  ⚠️ 如果以后改了仓库名，把下面两处 /personal-homepage/ 一起改掉。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>页面走丢了 · 崇施涵</title>
<style>
  :root{--purple:#641cff;--purple2:#9d56ff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050505;color:#f6f6f3;font-family:"Inter","Noto Sans SC",-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:40px 24px;text-align:center}
  .box{max-width:520px}
  .code{font-size:clamp(80px,18vw,150px);font-weight:700;letter-spacing:-.05em;line-height:1;color:#f6f6f3;text-shadow:0 0 42px rgba(157,86,255,.45);margin:0}
  h1{font-size:clamp(22px,4vw,30px);font-weight:500;letter-spacing:-.03em;margin:20px 0 12px}
  p.tip{color:#9a9aa1;font-size:13.5px;line-height:1.85;margin:0 0 28px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{display:inline-flex;align-items:center;justify-content:center;min-width:158px;padding:14px 18px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;text-decoration:none;transition:.25s}
  .a1{background:var(--purple);color:#fff}
  .a1:hover{background:#7b37ff;transform:translateY(-2px)}
  .a2{border:1px solid #2f2f36;color:#c8adff}
  .a2:hover{border-color:var(--purple2);background:rgba(157,86,255,.1)}
  @media(prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
</style>
</head>
<body>
  <div class="box">
    <p class="code" aria-hidden="true">404</p>
    <h1>这个页面走丢了</h1>
    <p class="tip">你点进来的地址不存在——可能是链接拼错了，也可能那个页面被我搬走了。<br />回首页看看，或者直接去问数字分身。</p>
    <div class="btns">
      <a class="a1" href="/personal-homepage/">回首页</a>
      <a class="a2" href="/personal-homepage/#chat">问数字分身</a>
    </div>
  </div>
</body>
</html>
