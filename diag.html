<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图片自检</title>
<meta name="robots" content="noindex" />
<style>
  body{margin:0;background:#050505;color:#f6f6f3;font:15px/1.7 "Microsoft YaHei",system-ui,sans-serif;padding:28px}
  h1{font-size:24px;margin:0 0 6px}
  .sub{color:#929298;font-size:13px;margin-bottom:22px}
  .verdict{font-size:34px;font-weight:700;letter-spacing:-.02em;padding:18px 20px;border:1px solid #252529;background:#0b0b0d;margin-bottom:14px}
  .verdict b{color:#9d56ff}
  .bad{border-color:#5a1d1d;background:#170b0b}
  .step{border:1px solid #252529;background:#0b0b0d;padding:16px 18px;margin-bottom:12px}
  .step h2{font-size:14px;margin:0 0 10px;letter-spacing:.04em;color:#c5c5c8}
  .res{font-size:19px;font-weight:700}
  .ok{color:#3ddc84}.fail{color:#ff6b6b}
  .box{width:240px;height:60px;border:1px solid #252529;display:block;margin-top:10px}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .row img{width:84px;height:84px;object-fit:cover;border:2px solid #9d56ff;border-radius:6px;background:#141418}
  .row img.miss{border-color:#ff6b6b;background:repeating-linear-gradient(135deg,#2a1414 0 6px,#1a0d0d 6px 12px)}
  ul{list-style:none;padding:0;margin:12px 0 0;font-size:12px;color:#929298}
  li{padding:2px 0}
  code{color:#c5c5c8;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<h1>图片自检</h1>
<div class="sub">这个页面会告诉你：你的浏览器到底能不能下载到照片。请把「结论」那一行的内容转告我。</div>
<div class="verdict" id="verdict">正在检测…</div>

<div class="step">
  <h2>第 1 步｜不经网络的图片（内联在页面里）</h2>
  <div class="res" id="r1">检测中…</div>
  <img class="box" id="inline-img" alt="内联测试图" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAAA8CAIAAADXHaAKAAAAwUlEQVR4nO3SQQkAIQAAQb0gJrE/xroSgrDMJNjHzrP2gIrvdQDcZGhSDE2KoUkxNCmGJsXQpBiaFEOTYmhSDE2KoUkxNCmGJsXQpBiaFEOTYmhSDE2KoUkxNCmGJsXQpBiaFEOTYmhSDE2KoUkxNCmGJsXQpBiaFEOTYmhSDE2KoUkxNCmGJsXQpBiaFEOTYmhSDE2KoUkxNCmGJsXQpBiaFEOTYmhSDE2KoUkxNCmGJsXQpBiaFEOTYmhSDM0o+QG9VQGa/8d3lQAAAABJRU5ErkJggg==" />
</div>

<div class="step">
  <h2>第 2 步｜相册图片各测 9 张（下面出现的就是能显示的）</h2>
  <div class="res" id="r2">检测中…</div>
  <div class="row" id="row-webp"></div>
  <div class="row" id="row-jpg"></div>
</div>

<div class="step">
  <h2>第 3 步｜环境信息</h2>
  <ul id="env"></ul>
</div>

<script>
var webp = [], jpg = [], i;
for (i = 1; i <= 9; i++) {
  webp.push("assets/gallery/preview-0" + i + ".webp");
  jpg.push("assets/gallery/preview-0" + i + ".jpg");
}

function probe(list, host, cb) {
  var done = 0, ok = 0, lines = [];
  list.forEach(function (src, idx) {
    var im = new Image(), t0 = performance.now(), el = document.createElement("img");
    el.src = src; el.alt = "";
    host.appendChild(el);
    el.classList.add("miss");
    el.onload = el.onerror = function () {
      var dt = Math.round(performance.now() - t0);
      if (el.naturalWidth > 0) { ok++; el.classList.remove("miss"); lines.push(src + " OK " + dt + "ms " + el.naturalWidth + "x" + el.naturalHeight); }
      else { lines.push(src + " 失败 " + dt + "ms"); }
      if (++done === list.length) cb(ok, lines);
    };
  });
}

var r1 = document.getElementById("r1"), r2 = document.getElementById("r2");
var v = document.getElementById("verdict");
var inlineOK = false;

var testImg = new Image();
testImg.onload = function () { inlineOK = testImg.naturalWidth > 0; check1(); };
testImg.onerror = function () { check1(); };
testImg.src = document.getElementById("inline-img").src;
document.getElementById("inline-img").onload = function () { inlineOK = true; };
function check1() {
  r1.textContent = inlineOK ? "能看到 → 浏览器显示图片功能正常" : "看不到 → 你的浏览器/扩展正在阻止图片显示";
  r1.className = "res " + (inlineOK ? "ok" : "fail");
}

var transfer = function (src) {
  var e = performance.getEntriesByType("resource").filter(function (r) { return r.name.indexOf(src) >= 0; })[0];
  return e ? Math.round(e.transferSize || 0) : null;
};

probe(webp, document.getElementById("row-webp"), function (okW, linesW) {
  probe(jpg, document.getElementById("row-jpg"), function (okJ, linesJ) {
    r2.textContent = "图片能显示的：WebP " + okW + "/9 ｜ JPEG " + okJ + "/9";
    r2.className = "res " + ((okW + okJ) > 0 ? "ok" : "fail");

    var bits = [];
    bits.push("本机图片显示：" + (inlineOK ? "正常" : "被阻止"));
    bits.push("WebP " + okW + "/9");
    bits.push("JPEG " + okJ + "/9");
    v.innerHTML = "结论：<b>" + bits.join("　·　") + "</b>";
    if (!inlineOK || (okW + okJ) === 0) v.classList.add("bad");

    var ul = document.createElement("ul");
    linesW.concat(linesJ).forEach(function (l) {
      var li = document.createElement("li");
      li.textContent = l + (transfer(l.split(" ")[0]) !== null ? "  传输 " + transfer(l.split(" ")[0]) + " 字节" : "");
      ul.appendChild(li);
    });
    document.getElementById("env").appendChild(ul);
  });
});

var env = document.getElementById("env");
function add(k, val) {
  var li = document.createElement("li");
  li.innerHTML = k + "：<code>" + String(val).replace(/</g, "&lt;") + "</code>";
  env.appendChild(li);
}
add("网络在线", navigator.onLine);
add("屏幕像素比", window.devicePixelRatio);
add("视口", innerWidth + "x" + innerHeight);
add("是否支持 WebP", (function () { var c = document.createElement("canvas"); return c.toDataURL("image/webp").indexOf("image/webp") > 0; })());
add("是否支持容器查询", CSS.supports("width", "1cqw"));
add("浏览器", navigator.userAgent);
</script>
</body>
</html>
